<ion-header>
  <ion-toolbar>
    <ion-title>{{ studentNumber }}</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/favourites">
        <ion-icon slot="icon-only" name="heart"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item lines="none">
    <ion-label position="fixed">Search</ion-label>
    <ion-input placeholder="Movie Name" [(ngModel)]="searchTerm"></ion-input>
  </ion-item>
  <ion-button expand="block" color="primary" (click)="onSearchChange({detail: {value: searchTerm}})">
    SEARCH
  </ion-button>

  <h3 style="padding: 0 16px;">
    {{ searchTerm === '' ? "Today's Trending Movies" : searchTerm + " Movies" }}
  </h3>

  <ion-card *ngFor="let movie of movies" [routerLink]="['/movie-details', movie.id]">
    <img *ngIf="movie.poster_path" [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path" alt="Movie Poster" />
    <ion-card-content>
      {{ movie.overview }}
    </ion-card-content>
  </ion-card>
</ion-content>
